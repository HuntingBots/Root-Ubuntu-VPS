version: '3.8'

services:
  root-ubuntu-vps-1:
    image: root-ubuntu-vps:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: root-ubuntu-vps-1
    hostname: ubuntu-vps-1
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP Web Server (IPTV)
      - "7681:7681" # Web Terminal (ttyd)
      - "2222:22"   # OpenSSH Server
    environment:
      - ROOT_PASSWORD=HuntingBots123!
      - PORT=7681
      - QUICK_TUNNEL=true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

